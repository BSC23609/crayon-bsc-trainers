<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Sales AI Suite</title>
<style>
:root{color-scheme:light;--brand:#1f4e79;--brand2:#2e6db4;--ink:#1a1f29;--muted:#5a6473;--line:#d5deea}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef1f6;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;text-align:center}
.brandbar{background:#fff;border:1px solid #e2e8f1;border-radius:16px;padding:14px 22px;display:inline-flex;box-shadow:0 2px 12px rgba(31,78,121,.10);margin-bottom:16px}
.brandbar img{height:52px;display:block}
h1{font-size:22px;margin:0 0 4px;color:var(--brand)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
form{background:#fff;border:1px solid #e2e8f1;border-radius:16px;padding:22px 20px;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.05)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#2b3442}
input{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;outline:none;background:#fff}
input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(46,109,180,.15)}
button{width:100%;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.msg{font-size:13px;border-radius:9px;padding:9px 11px;margin-bottom:14px;display:none}
.msg.err{display:block;background:#fdecea;color:#8a2c20}
.msg.ok{display:block;background:#e6f4ea;color:#1e6b34}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 14px}
.links{margin-top:14px;font-size:13px;text-align:center}
.links a{color:var(--brand2);text-decoration:none}
.foot{margin-top:18px;font-size:11.5px;color:#8a94a3}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="brandbar"><img src="group-logo.png" alt="The Bharat Steel Group"></div>
  <h1 id="h">Sales AI Suite</h1>
  <p class="sub" id="sub">Sign in with your Emp No and password.</p>

  <form id="loginForm" autocomplete="on">
    <div class="msg" id="lmsg"></div>
    <label for="emp">Emp No</label>
    <input id="emp" name="username" autocomplete="username" placeholder="e.g. BSC/120" autocapitalize="characters" required>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button id="lbtn" type="submit">Sign in</button>
    <div class="links">Forgot your password? Ask an admin to reset it.</div>
  </form>

  <form id="changeForm" class="hide" autocomplete="off">
    <div class="msg" id="cmsg"></div>
    <div id="oldWrap">
      <label for="old">Current password</label>
      <input id="old" type="password" autocomplete="current-password">
    </div>
    <label for="np">New password</label>
    <input id="np" type="password" autocomplete="new-password" required>
    <p class="hint">At least 8 characters, with letters and a number.</p>
    <label for="np2">Confirm new password</label>
    <input id="np2" type="password" autocomplete="new-password" required>
    <button id="cbtn" type="submit">Save password</button>
    <div class="links"><a href="index.html" id="cancel">Cancel</a></div>
  </form>

  <div class="foot">Internal tool of The Bharat Steel Group</div>
</div>
<script>
var P = new URLSearchParams(location.search);
var next = P.get('next') || 'index.html';
if (!/^[A-Za-z0-9_\-.\/?=&%]+$/.test(next) || next.indexOf('//') !== -1 || /^login\.html/.test(next)) next = 'index.html';
var lastPw = '';

function msg(id, text, ok) { var m = document.getElementById(id); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
function post(action, data) {
  return fetch('/api/auth?action=' + action, { method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data || {}) })
    .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
}
function showChange(firstTime) {
  document.getElementById('loginForm').classList.add('hide');
  document.getElementById('changeForm').classList.remove('hide');
  document.getElementById('h').textContent = firstTime ? 'Set your password' : 'Change password';
  document.getElementById('sub').textContent = firstTime
    ? 'Welcome! Please choose your own password to continue.' : 'Choose a new password for your login.';
  if (firstTime && lastPw) { document.getElementById('old').value = lastPw; document.getElementById('oldWrap').classList.add('hide'); }
  if (firstTime) document.getElementById('cancel').parentNode.classList.add('hide');
  (lastPw && firstTime ? document.getElementById('np') : document.getElementById('old')).focus();
}

document.getElementById('loginForm').onsubmit = function (e) {
  e.preventDefault();
  var b = document.getElementById('lbtn'); b.disabled = true; b.textContent = 'Signing in...';
  lastPw = document.getElementById('pw').value;
  post('login', { emp_no: document.getElementById('emp').value, password: lastPw })
    .then(function (j) {
      if (!j.user) { msg('lmsg', j.error || 'Could not sign in.'); return; }
      if (j.user.must_change) return showChange(true);
      location.replace(next);
    })
    .catch(function () { msg('lmsg', 'Could not reach the server. Check the internet and try again.'); })
    .then(function () { b.disabled = false; b.textContent = 'Sign in'; });
};

document.getElementById('changeForm').onsubmit = function (e) {
  e.preventDefault();
  var np = document.getElementById('np').value, np2 = document.getElementById('np2').value;
  if (np !== np2) return msg('cmsg', 'The two new passwords do not match.');
  var b = document.getElementById('cbtn'); b.disabled = true;
  post('change', { old_password: document.getElementById('old').value, new_password: np })
    .then(function (j) {
      if (!j.ok) {
        if (j._status === 401) { location.replace('login.html?next=' + encodeURIComponent(next)); return; }
        if (/current password/i.test(j.error || '')) document.getElementById('oldWrap').classList.remove('hide');
        return msg('cmsg', j.error || 'Could not save the password.');
      }
      msg('cmsg', 'Password saved. Opening the suite...', true);
      setTimeout(function () { location.replace(next); }, 700);
    })
    .catch(function () { msg('cmsg', 'Could not reach the server. Try again.'); })
    .then(function () { b.disabled = false; });
};

// Already signed in? Go straight in (or to the change form when asked).
fetch('/api/auth?action=me', { credentials: 'same-origin', cache: 'no-store' })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    if (!j.user) { document.getElementById('emp').focus(); return; }
    if (P.get('change') === '1' || j.user.must_change) return showChange(j.user.must_change);
    location.replace(next);
  })
  .catch(function () {});
</script>
</body>
</html>
